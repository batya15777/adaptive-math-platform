services:

  # ── React client (static site — Render handles SPA routing + SSL) ──────────
  - type: web
    name: adaptive-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Update this to https://api.arhitech.me once the custom domain is set on adaptive-server
      - key: VITE_API_BASE_URL
        value: https://adaptive-server.onrender.com

  # ── Spring Boot API ────────────────────────────────────────────────────────
  - type: web
    name: adaptive-server
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    envVars:
      # ── Database (fill in from Railway Variables tab) ──────────────────────
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SCHEMA
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # ── CORS ──────────────────────────────────────────────────────────────
      # Add https://api.arhitech.me once custom domain is configured
      - key: CORS_ALLOWED_ORIGINS
        value: https://adaptive-client.onrender.com,https://arhitech.me,https://www.arhitech.me
      # ── Internal microservice URLs ─────────────────────────────────────────
      - key: AI_MICROSERVICE_URL
        value: https://adaptive-ai-questions.onrender.com
      - key: AI_TUTOR_URL
        value: https://adaptive-ai-tutor.onrender.com
      - key: ML_CLUSTERING_URL
        value: https://adaptive-student-clustering.onrender.com
      # ── Seeding (set SEED_ADMIN=true on first deploy only, then flip to false) ──
      - key: SEED_DATA
        value: "false"
      - key: SEED_ADMIN
        value: "true"
      - key: SEED_DUMMY_STUDENTS
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Admin
      # ── AI question generation ─────────────────────────────────────────────
      - key: QUESTIONS_AI_ENABLED
        value: "true"
      - key: QUESTIONS_AI_THEME
        value: space
      - key: QUESTIONS_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # ── Email ──────────────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Adaptive Math <verification@mail.adaptivemathplatform.dev>"

  # ── AI Questions Generator ─────────────────────────────────────────────────
  - type: web
    name: adaptive-ai-questions
    runtime: docker
    dockerContext: ./microservices/AI_Questions_Generator
    dockerfilePath: ./microservices/AI_Questions_Generator/Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false

  # ── AI Tutor Chat ──────────────────────────────────────────────────────────
  - type: web
    name: adaptive-ai-tutor
    runtime: docker
    dockerContext: ./microservices/AI_Tutor_Chat
    dockerfilePath: ./microservices/AI_Tutor_Chat/Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_TUTOR_ENABLE_OPENAI
        value: "true"

  # ── Student Clustering ─────────────────────────────────────────────────────
  - type: web
    name: adaptive-student-clustering
    runtime: docker
    dockerContext: ./microservices/student-clustering-service
    dockerfilePath: ./microservices/student-clustering-service/Dockerfile
