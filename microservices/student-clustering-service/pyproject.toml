[project]
name = "student-clustering-service"
version = "0.1.0"
description = "FastAPI microservice that K-Means clusters students by their error patterns."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.0",
    "scikit-learn>=1.9.0",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
