spring.application.name=server

spring.velocity.suffix=.vm
spring.velocity.cache=false

server.port=8080
server.tomcat.basedir=${user.home}/adaptive-server

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.profiles.active=production
aspects.logging.enabled=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_SCHEMA:adaptive_db}?useSSL=true&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Seed initial data (Calculation subject, add/sub/mult/div sub-subjects, templates) for manual tests
app.seed-data=${SEED_DATA:false}

# Seed a single ADMIN account on startup (idempotent) so the admin panel + "Run clustering"
# are reachable without manual SQL. Disabled by default; enable once with SEED_ADMIN=true.
# Credentials are overridable so the default password never has to ship to production.
app.seed-admin=${SEED_ADMIN:false}
app.admin.email=${ADMIN_EMAIL:admin@adaptive.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.full-name=${ADMIN_FULL_NAME:Admin User}

# Seed ~8 dummy STUDENT accounts (student1..8@test.com / 123456) with deliberately
# distinct attempt histories so K-Means produces several clear clusters. Disabled by
# default; enable for local testing with SEED_DUMMY_STUDENTS=true. Idempotent.
app.seed-dummy-students=${SEED_DUMMY_STUDENTS:false}

ai.microservice.url=${AI_MICROSERVICE_URL:http://localhost:8000}
ai.tutor.url=${AI_TUTOR_URL:http://127.0.0.1:8001}

# Python K-Means clustering microservice. Port 8002 to avoid colliding with the
# AI tutor chat service on 8001 (AI generator owns 8000).
ml.clustering.url=${ML_CLUSTERING_URL:http://localhost:8002}

# Live question generation: when true, the next-question flow tries the (cluster-aware)
# AI generator first and falls back to the code-based generator on any failure.
questions.ai.enabled=${QUESTIONS_AI_ENABLED:false}
questions.ai.theme=${QUESTIONS_AI_THEME:space}
questions.ai.api-key=${QUESTIONS_AI_API_KEY:}

resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:Adaptive Math <verification@mail.adaptivemathplatform.dev>}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
